[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "citavi-mcp"
version = "0.1.0"
description = "MCP server that lets Claude work with a running Citavi instance via the ClaudeCitavi bridge add-on."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dennis Hertell" }]
dependencies = [
  "mcp>=2.0,<3",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
citavi-mcp = "citavi_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/citavi_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.hatch.build.targets.wheel.force-include]
"../docs/ZITIERREGELN.md" = "citavi_mcp/ZITIERREGELN.md"

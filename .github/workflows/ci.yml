name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp-server:
    name: MCP server (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: mcp-server/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -v

  bridge:
    name: Bridge add-on (compile check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Build Citavi stubs
        run: bridge/ci-stubs/build-stubs.sh "$RUNNER_TEMP/citavi-stubs"
      - name: Build add-on against stubs
        run: dotnet build bridge/src/ClaudeCitavi.Bridge -c Release -p:CitaviDir="$RUNNER_TEMP/citavi-stubs" --nologo
